[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-api"
version = "0.2.0"
description = "Self-hosted Google Scholar scraping API with SerpAPI-compatible JSON output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scholar-api = "scholar_api.__main__:main"

[tool.setuptools]
packages = ["scholar_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
